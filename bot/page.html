<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>D2S 리모컨</title>
<style>
:root{
 --abyss:#0d0b0a;--iron:#181513;--iron2:#211d19;--edge:#2f2924;--edge2:#3f362e;
 --bone:#ece3cf;--ash:#8f8270;--dim:#5f564b;--gold:#d2a34a;--gold2:#f0c96f;--blood:#a3302a;--blood2:#c4423a;
 --mana:#4a6fd0;--life:#7fbf5a;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--bone);
 background:radial-gradient(120% 60% at 50% -10%,#241c15 0,var(--abyss) 60%) fixed,var(--abyss);
 font:15px/1.45 "Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.01em;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
[hidden]{display:none!important}

/* header: view switch */
.bar{position:sticky;top:0;z-index:5;padding:8px 14px 10px;background:linear-gradient(var(--abyss) 70%,transparent)}
.views{max-width:760px;margin:0 auto;display:grid;grid-template-columns:.8fr 1.15fr 1fr 1.05fr;padding:4px;border-radius:999px;
 background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
.views button{border:0;background:none;color:var(--ash);font-weight:600;font-size:14.5px;padding:9px 0;border-radius:999px;white-space:nowrap}
.views button[aria-selected=true]{color:var(--abyss);background:linear-gradient(var(--gold2),var(--gold));
 box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 10px rgba(210,163,74,.25)}

.app{max-width:760px;margin:0 auto;padding:2px 14px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.app>*,.items>*{min-width:0}
.left,.right{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}

/* status plate */
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 14px 14px 16px;
 border-radius:var(--r);background:linear-gradient(160deg,var(--iron2),var(--iron));box-shadow:inset 0 0 0 1px var(--edge)}
.runs{font-size:40px;font-weight:800;line-height:.9;color:var(--gold2);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
 text-shadow:0 0 18px rgba(240,201,111,.25)}
.runs::after{content:"판";font-size:13px;font-weight:600;color:var(--ash);margin-left:3px;letter-spacing:0;text-shadow:none}
.st{min-width:0}
.st b{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.st b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.st.on b{color:var(--bone)}
.st.on b::before{background:var(--life);box-shadow:0 0 0 0 rgba(127,191,90,.6);animation:beat 1.8s ease-out infinite}
@keyframes beat{70%{box-shadow:0 0 0 7px rgba(127,191,90,0)}100%{box-shadow:0 0 0 0 rgba(127,191,90,0)}}
.st span{display:block;margin-top:3px;font-size:12.5px;color:var(--ash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{border:0;border-radius:12px;padding:0 18px;height:48px;min-width:92px;font-weight:800;font-size:16px;
 display:flex;align-items:center;justify-content:center;gap:8px;
 background:linear-gradient(var(--gold2),var(--gold));color:#1b130a;box-shadow:0 6px 18px rgba(210,163,74,.22)}
.go::before{content:"";border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent currentColor}
.go.on{background:linear-gradient(var(--blood2),var(--blood));color:#fff3ec;box-shadow:0 6px 18px rgba(163,48,42,.28)}
.go.on::before{border:0;width:11px;height:11px;background:currentColor;border-radius:2px}

/* 3-minute stage countdown */
.cd{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:4px 12px;padding:12px 16px 14px;border-radius:var(--r);
 background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
.cd[hidden]{display:none}
.cd .lbl{font-size:14px;font-weight:700;color:var(--bone)}
.cd .sub{grid-column:1;font-size:12.5px;color:var(--ash)}
.cd .num{grid-row:1/3;grid-column:2;font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;
 letter-spacing:-.02em;color:var(--gold2)}
.cd .cdbar{grid-column:1/3;height:6px;border-radius:3px;background:var(--abyss);overflow:hidden;margin-top:6px}
.cd .cdbar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));
 transform-origin:left center;transition:transform .25s linear}
.cd.low .num{color:var(--blood2)}
.cd.low .cdbar i{background:linear-gradient(90deg,var(--blood),var(--blood2))}
.cd.idle .num{color:var(--dim)}

/* stage to repeat */
.stage{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 12px;padding:12px 14px;border-radius:var(--r);
 background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
.stage .lbl{font-size:14px;font-weight:700;color:var(--bone)}
.step{display:flex;align-items:center;justify-self:end;border-radius:12px;background:var(--abyss);box-shadow:inset 0 0 0 1px var(--edge2)}
.step button{border:0;background:none;color:var(--gold2);font-size:22px;width:44px;height:44px}
.step input{width:56px;height:44px;border:0;background:none;color:var(--gold2);text-align:center;font:inherit;font-size:22px;
 font-weight:800;font-variant-numeric:tabular-nums;-moz-appearance:textfield;-webkit-user-select:text;user-select:text}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stage .apply{border:0;height:44px;padding:0 16px;border-radius:12px;font-weight:800;color:#1b130a;
 background:linear-gradient(var(--gold2),var(--gold))}
.stage .apply:disabled{background:var(--iron2);color:var(--dim);box-shadow:inset 0 0 0 1px var(--edge)}
.stage .note{grid-column:1/-1;font-size:12px;color:var(--ash);margin-top:-2px}
.stage .note.ok{color:var(--life)}

/* the game screen, framed like a panel of the game */
.screen{position:relative;border-radius:var(--r);overflow:hidden;background:#000;touch-action:none;
 box-shadow:0 0 0 1px #000,0 0 0 2px #5b4a2c,0 0 0 3px #000,0 14px 30px rgba(0,0,0,.55)}
.screen img{display:block;width:100%;height:auto;pointer-events:none}
.screen.empty{aspect-ratio:4/3}
.screen.empty img{position:absolute;opacity:0}
.screen .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--ash);font-size:13px;text-align:center;padding:24px}
.tag{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;
 background:rgba(13,11,10,.72);font-size:11.5px;font-weight:600;color:var(--bone);pointer-events:none}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blood2)}
.screen.empty .tag{display:none}
.dot{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2px solid var(--gold2);
 pointer-events:none;animation:ping .45s ease-out forwards}
.dot.run{border-color:var(--mana);animation:none;opacity:.95;box-shadow:0 0 12px rgba(74,111,208,.6)}
@keyframes ping{from{transform:scale(.35);opacity:1}to{transform:scale(1.25);opacity:0}}
.hint{font-size:12.5px;color:var(--ash);margin:0 4px;line-height:1.5}
.hint b{color:var(--bone);font-weight:600}

/* modifier for the next tap */
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--iron);
 box-shadow:inset 0 0 0 1px var(--edge)}
.mods button{border:0;background:none;color:var(--ash);font-size:14px;font-weight:600;padding:10px 0;border-radius:9px}
.mods button[aria-pressed=true]{background:var(--iron2);color:var(--gold2);box-shadow:inset 0 0 0 1px var(--edge2)}

/* deck: round arrow pad + key caps */
.deck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.pad{position:relative;width:186px;height:186px;border-radius:50%;
 background:radial-gradient(circle at 50% 40%,#2a241f,#141110 72%);box-shadow:inset 0 0 0 1px var(--edge),0 10px 24px rgba(0,0,0,.45);
 display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;gap:2px}
.pad button{border:0;background:none;color:var(--gold);font-size:20px;border-radius:14px;touch-action:none}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
.pad .hub{grid-area:2/2;margin:8px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a3028,#17130f);
 box-shadow:inset 0 0 0 1px var(--edge)}
.pad button.held{background:radial-gradient(circle,rgba(240,201,111,.35),transparent 70%);color:var(--gold2)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keys button{border:0;border-radius:12px;padding:12px 8px 11px;font-size:16px;font-weight:700;line-height:1.15;touch-action:none;
 background:linear-gradient(#2a241f,#1a1613);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px var(--edge),0 3px 0 #0a0908}
.keys button small{display:block;font-size:11.5px;font-weight:500;color:var(--ash);margin-top:4px}
.keys button.held{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--gold),0 1px 0 #0a0908;color:var(--gold2)}

.scan{display:grid;grid-template-columns:1fr auto;gap:10px}
.scan button,.scan a{display:flex;align-items:center;justify-content:center;height:48px;border-radius:12px;font-weight:700;
 text-decoration:none;font-size:15px}
.scan button{border:0;color:var(--gold2);background:linear-gradient(#2a241f,#1a1613);box-shadow:inset 0 0 0 1px var(--gold)}
.scan button[disabled]{color:var(--ash);box-shadow:inset 0 0 0 1px var(--edge)}
.scan a{padding:0 16px;color:var(--bone);background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
details{border-radius:var(--r);background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
summary{padding:13px 16px;font-size:14px;font-weight:600;color:var(--ash);list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--dim);font-weight:400}
details[open] summary::after{content:"−"}
summary::-webkit-details-marker{display:none}
#log{margin:0;padding:0 16px 16px;font:12px/1.6 ui-monospace,"SF Mono",Menlo,monospace;white-space:pre-wrap;max-height:320px;
 overflow:auto;color:var(--ash);-webkit-user-select:text;user-select:text}

/* collected items */
.items{max-width:760px;margin:0 auto;padding:2px 14px 30px;display:grid;gap:12px}
/* essence statistics: how many come in per hour, per run, per stage */
.est{padding:16px;border-radius:var(--r);background:linear-gradient(160deg,var(--iron2),var(--iron));box-shadow:inset 0 0 0 1px var(--edge)}
.est .etop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.est .etop b{font-size:15px;display:block}
.est .etop small{font-size:12.5px;color:var(--ash)}
.est .big{font-size:34px;font-weight:800;color:var(--gold2);line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.est .big small{display:block;font-size:12px;font-weight:600;color:var(--ash);margin-top:4px}
.est .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.est .kv div{padding:9px 10px;border-radius:10px;background:var(--abyss);box-shadow:inset 0 0 0 1px var(--edge2)}
.est .kv span{display:block;font-size:11.5px;color:var(--ash)}
.est .kv b{font-size:17px;font-variant-numeric:tabular-nums}
.est .spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:14px}
.est .spark i{flex:1;background:var(--gold);opacity:.75;border-radius:2px 2px 0 0;min-height:2px}
.est .spark i.z{background:var(--edge2);opacity:1}
.est .cap{font-size:11.5px;color:var(--ash);margin-top:4px;display:flex;justify-content:space-between}
.est h4{margin:16px 0 6px;font-size:13px;color:var(--ash);font-weight:600}
.est .stg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.est .stg .ebar{height:8px;border-radius:4px;background:var(--abyss);overflow:hidden}
.est .stg .ebar i{display:block;height:100%;background:var(--gold)}
.est .stg .best{color:var(--gold2);font-weight:700}
.est .stg em{font-style:normal;color:var(--ash);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.est .none{font-size:13px;color:var(--ash);margin-top:8px;line-height:1.5}
/* run table: one row per run, tap to open the items of that run */
.rnow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r);background:linear-gradient(160deg,#2c2316,var(--iron));
 box-shadow:inset 0 0 0 1px rgba(210,163,74,.5)}
.rnow .dotl{width:9px;height:9px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 4px rgba(210,163,74,.18);flex:none}
.rnow div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rnow b{font-size:15px}
.rnow span{font-size:12.5px;color:var(--ash)}
.rnow .clk{margin-left:auto;font-size:26px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.rsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rsum div{padding:10px 11px;border-radius:12px;background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
.rsum span{display:block;font-size:11.5px;color:var(--ash)}
.rsum b{font-size:18px;font-variant-numeric:tabular-nums}
.rsum b.g{color:var(--gold2)}
.rtab{border-radius:var(--r);background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
.rh,.rr{display:grid;grid-template-columns:34px minmax(0,1.5fr) 50px 40px minmax(0,1fr);gap:8px;align-items:center;padding:0 12px}
.rh{padding-top:10px;padding-bottom:8px;font-size:11.5px;color:var(--ash);border-bottom:1px solid var(--edge)}
.rh span:nth-child(3),.rh span:nth-child(4),.rr .c3,.rr .c4{text-align:right}
.rr{width:100%;border:0;background:none;color:var(--bone);text-align:left;font:inherit;font-size:13.5px;min-height:46px;
 border-bottom:1px solid rgba(255,255,255,.04);font-variant-numeric:tabular-nums}
.rr:nth-child(even){background:rgba(255,255,255,.018)}
.rr .c1{font-weight:700;color:var(--ash)}
.rr .c2 small{display:block;font-size:11px;color:var(--ash)}
.rr .c4{font-weight:800;color:var(--gold2)}
.rr .c4.z{color:var(--dim);font-weight:600}
.rr .c5{font-size:12.5px;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .c5 b{color:var(--bone);font-weight:700;margin-right:4px}
.rr.live{background:linear-gradient(90deg,rgba(210,163,74,.12),transparent 70%);box-shadow:inset 3px 0 0 var(--gold)}
.rr.live .c1{color:var(--gold2)}
.rr[aria-expanded=true]{background:var(--iron2)}
.rdet{padding:6px 14px 12px 54px;background:var(--iron2);border-bottom:1px solid var(--edge);font-size:13px}
.rdet p{margin:4px 0;display:flex;gap:8px}
.rdet time{color:var(--ash);font-variant-numeric:tabular-nums;flex:none}
.rdet em{font-style:normal;color:var(--ash);margin-left:auto;white-space:nowrap}
.rdet .why{color:var(--ash);font-size:12px;margin-top:6px}
.rempty{padding:22px 16px;color:var(--ash);font-size:13.5px;line-height:1.55}
.ess{padding:14px 16px;border-radius:var(--r);background:linear-gradient(160deg,var(--iron2),var(--iron));
 box-shadow:inset 0 0 0 1px var(--edge)}
.ess .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ess .hd b{font-size:15px}
.ess .hd .n{font-size:28px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums}
.ess .hd .n small{font-size:13px;color:var(--ash);font-weight:600;margin-left:2px}
.ess .sub{font-size:12.5px;color:var(--ash);margin-top:2px}
.ess ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.ess li{display:flex;justify-content:space-between;font-size:14px}
.ess li span:last-child{font-weight:700;font-variant-numeric:tabular-nums;color:var(--bone)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:0;background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ash);font-size:13px;
 font-weight:600;padding:8px 13px;border-radius:999px}
.chips button b{color:var(--bone);font-weight:700;margin-left:5px;font-variant-numeric:tabular-nums}
.chips button[aria-pressed=true]{background:var(--iron2);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold2)}
.hour{margin:10px 4px 0;font-size:13px;color:var(--ash);display:flex;justify-content:space-between;align-items:baseline}
.hour b{color:var(--bone);font-weight:700;font-size:14px}
#list{display:grid;gap:8px}
.it{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border:0;width:100%;
 text-align:left;border-radius:12px;background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
.it .th{width:72px;height:50px;border-radius:8px;background:#000 center top/cover no-repeat;box-shadow:inset 0 0 0 1px var(--edge2)}
.it .nm{font-weight:700;font-size:15px;line-height:1.3;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .sb{font-size:12px;color:var(--ash)}
.it time{font-size:12px;color:var(--ash);font-variant-numeric:tabular-nums;align-self:start;padding-top:4px}
.it .nm{display:block}
.it .stars{display:block;font-size:12px;letter-spacing:1px;color:var(--dim);margin:1px 0 1px}
.it .stars i{font-style:normal;color:var(--gold2)}
.it .sb{display:block}
.it.starred{box-shadow:inset 0 0 0 1px rgba(210,163,74,.55),inset 3px 0 0 var(--gold);background:linear-gradient(90deg,rgba(210,163,74,.08),transparent 60%),var(--iron)}
.q-gold{color:#c9a86c}.q-green{color:#5fd05f}.q-yellow{color:#ece070}.q-orange{color:#e9a04a}.q-blue{color:#8aa0f0}
.clear{justify-self:center;margin-top:8px;border:0;background:none;color:#d98b7f;font-size:14px;font-weight:600;
 padding:10px 18px;border-radius:12px;box-shadow:inset 0 0 0 1px #5a2a24}
.empty{color:var(--ash);padding:32px 16px;text-align:center;border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--edge);line-height:1.6}
.more{border:0;background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge);color:var(--bone);padding:13px;border-radius:12px;font-weight:600}
.zoom{position:fixed;inset:0;background:rgba(8,7,6,.94);display:grid;place-items:center;padding:20px;z-index:9}
.zoom img{max-width:100%;max-height:80vh;border-radius:8px;box-shadow:0 0 0 1px var(--edge2)}
.zoom p{margin:12px 0 0;text-align:center;color:var(--ash);font-size:13px}


/* keep list: what goes to the stash, per class */
.kp{padding:14px 16px;border-radius:var(--r);background:linear-gradient(160deg,var(--iron2),var(--iron));box-shadow:inset 0 0 0 1px var(--edge);
 font-size:13.5px;color:var(--ash);line-height:1.55}
.kp b{display:block;color:var(--bone);font-size:15px;margin-bottom:4px}
.kp .ocr{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}
.kp .ocr i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--life)}
.kp .ocr.off i{background:var(--blood2)}
#kList{display:grid;gap:6px}
.kg{margin:12px 4px 2px;font-size:13px;color:var(--ash);display:flex;justify-content:space-between}
.kg b{color:var(--bone);font-size:14px}
.ki{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 14px;border-radius:12px;
 background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}
.ki .nm{font-weight:700;font-size:15px}
.ki .nm.t-u{color:#c9a86c}.ki .nm.t-s{color:#5fd05f}.ki .nm.t-r{color:var(--gold2)}
.ki .stars{margin-left:8px;font-size:12px;letter-spacing:1px;color:var(--dim);font-weight:400;vertical-align:1px;white-space:nowrap}
.ki .stars i{font-style:normal;color:var(--gold2)}
.kmin{padding:12px 14px 14px;border-radius:var(--r);background:var(--iron);box-shadow:inset 0 0 0 1px var(--edge)}

 </div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var running=false,mod="",lastTouch=0,busyImg=false;
function post(path,body){return fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}).catch(function(){})}
function hms(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(function(n){return String(n).padStart(2,"0")}).join(":")}

/* status */
function status(){
 fetch("/api/status").then(function(r){return r.json()}).then(function(s){
  running=s.running;$("runs").textContent=s.runs;stageFrom(s);
  CD.limit=s.stage_limit||240;CD.end=(s.stage_left==null)?null:Date.now()+s.stage_left*1000;CD.run=running;cdDraw();
  $("st").className="st"+(running?" on":"");
  $("stb").textContent=running?"자동 진행 중 "+hms(s.now-s.started):"멈춰 있음";
  var last=(s.log||[]).slice(-1)[0]||"";$("sts").textContent=last.replace(/^\S+\s+/,"")||"기록 없음";
  $("go").textContent=running?"중지":"시작";$("go").className="go"+(running?" on":"");
  $("log").textContent=(s.log||[]).slice().reverse().join("\n");
 }).catch(function(){$("stb").textContent="PC와 연결이 끊김";$("sts").textContent="도우미가 켜져 있는지 확인하세요"});
}
/* stage to repeat: edited here, sent with 적용; the PC's value shows when nothing is being edited */
var stageNow=null,stageDirty=false;
function stageVal(){var v=parseInt($("stNum").value,10);return isNaN(v)?0:Math.max(0,Math.min(99,v))}
function stageMark(){stageDirty=stageVal()!==stageNow;$("stApply").disabled=!stageDirty;
 $("stNote").className="note";$("stNote").textContent=stageDirty?"적용을 누르면 다음 판부터 이 단계":(stageNow?"공포 영역 "+stageNow+"단계만 반복 중":"0 = 목록 맨 위 새 단계")}
function stageFrom(s){if(typeof s.stage!=="number")return;stageNow=s.stage;if(!stageDirty){$("stNum").value=s.stage;stageMark()}}
$("stMinus").onclick=function(){$("stNum").value=Math.max(0,stageVal()-1);stageMark()};
$("stPlus").onclick=function(){$("stNum").value=Math.min(99,stageVal()+1);stageMark()};
$("stNum").oninput=stageMark;
$("stApply").onclick=function(){var v=stageVal();$("stApply").disabled=true;
 post("/api/stage",{stage:v}).then(function(){stageNow=v;stageDirty=false;$("stNum").value=v;
  $("stNote").className="note ok";$("stNote").textContent=v?"공포 영역 "+v+"단계로 바꿈 (다음 판부터)":"단계 미지정으로 바꿈";
  setTimeout(status,500)})};
$("scanBtn").onclick=function(){
 if(running&&!confirm("자동 진행 중입니다. 장비 스캔은 진행이 손을 놓을 때까지 기다립니다. 계속할까요?"))return;
 var b=$("scanBtn");b.disabled=true;b.textContent="스캔 중… (기록 보기에서 진행 확인)";
 post("/api/scan");setTimeout(function(){b.disabled=false;b.textContent="장비 스캔 (F10)"},60000);
};
$("go").onclick=function(){post("/api/toggle").then(function(){setTimeout(status,400)})};

/* live picture: a continuous stream; still pictures every half second if the stream does not work */
var streamOn=false,streamFail=0,stillT=null;
function got(){$("wait").style.display="none";$("screen").classList.remove("empty")}
function noPic(msg){$("screen").classList.add("empty");$("wait").style.display="grid";$("wait").textContent=msg}
var streamCheck=null;
function startStream(){
 if(document.hidden)return;
 var img=$("live");streamOn=true;
 img.onload=function(){got();streamFail=0};
 clearTimeout(streamCheck);
 streamCheck=setTimeout(function(){             // no picture from the stream: half-second pictures instead
  if(streamOn&&!$("live").naturalWidth){stopStream();startStill()}},4000);
 img.onerror=function(){streamOn=false;streamFail++;if(streamFail<3){setTimeout(startStream,1500)}else{startStill()}};
 img.src="/stream.mjpg?t="+Date.now();
 setTimeout(function(){if(streamOn&&$("live").naturalWidth)got()},1500);
}
function stopStream(){streamOn=false;$("live").removeAttribute("src")}
function live(){
 if(document.hidden||busyImg||streamOn){return}
 busyImg=true;var im=new Image();
 im.onload=function(){$("live").src=im.src;got();busyImg=false};
 im.onerror=function(){noPic("게임 화면을 읽지 못함 - 게임 창이 꺼졌거나 최소화됨. 다시 시도하는 중");busyImg=false};
 im.src="/live.jpg?t="+Date.now();
}
var stillSince=0;
function startStill(){if(stillT)return;stillSince=Date.now();(function loop(){
 if(Date.now()-stillSince>30000&&$("live").naturalWidth){stillT=null;streamFail=0;startStream();return}   // try the stream again
 live();stillT=setTimeout(loop,500)})()}
startStream();
setInterval(function(){if(streamOn&&!document.hidden){stopStream();startStream()}},540000);

/* 3-minute stage countdown: the PC sends what is left, the phone counts down between updates */
var CD={end:null,limit:240,run:false};
function cdDraw(){
 var box=$("cd");box.hidden=!CD.run;if(!CD.run)return;
 if(CD.end==null){box.className="cd idle";$("cdNum").textContent="-:--";$("cdSub").textContent="사냥터에 들어가면 4분을 셉니다";
  $("cdBar").style.transform="scaleX(0)";return}
 var left=Math.max(0,(CD.end-Date.now())/1000),sec=Math.ceil(left);
 box.className="cd"+(sec<=30?" low":"");
 $("cdNum").textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
 $("cdSub").textContent=sec?"지나면 무조건 다음 판으로":"다음 판으로 이동 중";
 $("cdBar").style.transform="scaleX("+(left/CD.limit).toFixed(4)+")";
}
setInterval(cdDraw,250);
setInterval(status,2000);status();

/* tap / hold on the screen */
var scr=$("screen"),press=null,holdT=null,runDot=null,moveAt=0,keepT=null;
function rel(e){var r=$("live").getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)),px:e.clientX-scr.getBoundingClientRect().left,py:e.clientY-scr.getBoundingClientRect().top}}
function dot(p,run){var d=document.createElement("div");d.className="dot"+(run?" run":"");d.style.left=p.px+"px";d.style.top=p.py+"px";scr.appendChild(d);if(!run)setTimeout(function(){d.remove()},500);return d}
scr.addEventListener("pointerdown",function(e){
 e.preventDefault();lastTouch=Date.now();scr.setPointerCapture(e.pointerId);
 press=rel(e);
 holdT=setTimeout(function(){                       /* held: run toward the finger */
  holdT=null;runDot=dot(press,true);post("/api/drag",{act:"start",x:press.x,y:press.y});
  keepT=setInterval(function(){post("/api/drag",{act:"move",x:press.x,y:press.y})},500);
 },300);
});
scr.addEventListener("pointermove",function(e){
 if(!press)return;var p=rel(e);press=p;lastTouch=Date.now();
 if(runDot){runDot.style.left=p.px+"px";runDot.style.top=p.py+"px";
  if(Date.now()-moveAt>90){moveAt=Date.now();post("/api/drag",{act:"move",x:p.x,y:p.y})}}
});
function endPress(){
 if(!press)return;
 if(holdT){clearTimeout(holdT);holdT=null;dot(press,false);
  post("/api/tap",{x:press.x,y:press.y,mod:mod});if(mod)setMod("");
 }else if(runDot){post("/api/drag",{act:"end"});runDot.remove();runDot=null}
 clearInterval(keepT);keepT=null;press=null;setTimeout(live,150);
}
scr.addEventListener("pointerup",endPress);scr.addEventListener("pointercancel",endPress);

/* modifier for the next tap only */
function setMod(m){mod=m;Array.prototype.forEach.call(document.querySelectorAll(".mods button"),function(b){b.setAttribute("aria-pressed",String(b.dataset.m===m))})}
Array.prototype.forEach.call(document.querySelectorAll(".mods button"),function(b){b.onclick=function(){setMod(b.dataset.m)}});

/* arrows: held while the finger is on them */
Array.prototype.forEach.call(document.querySelectorAll(".pad button"),function(b){
 var t=null;
 function down(e){e.preventDefault();lastTouch=Date.now();b.setPointerCapture(e.pointerId);b.classList.add("held");
  post("/api/key",{k:b.dataset.k,act:"down"});t=setInterval(function(){post("/api/key",{k:b.dataset.k,act:"down"})},400)}
 function up(){if(!t)return;clearInterval(t);t=null;b.classList.remove("held");post("/api/key",{k:b.dataset.k,act:"up"});setTimeout(live,150)}
 b.addEventListener("pointerdown",down);b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);
});
/* single keys */
Array.prototype.forEach.call(document.querySelectorAll(".keys button"),function(b){
 b.onclick=function(){lastTouch=Date.now();b.classList.add("held");setTimeout(function(){b.classList.remove("held")},160);
  post("/api/key",{k:b.dataset.t,act:"tap"}).then(function(){setTimeout(live,200)})};
});

/* ---- collected items: everything registered or stashed (sold items are not kept) ---- */
var items=[],cat="all",shown=200;
var CATS=[["all","전체"],["star","★ 보관 목록"],["reg","유니크·세트 등록"],["charm","부적"],["rune","룬·열쇠"],["etc","기타"]];
function catOf(x){
 if(x.action&&x.action.indexOf("등록")>=0)return "reg";
 var k=(x.kind||"")+" "+(x.name||"")+" "+(x.raw||"");
 if(k.indexOf("정수")>=0)return "ess";
 if(k.indexOf("부적")>=0)return "charm";
 if(k.indexOf("룬")>=0||k.indexOf("열쇠")>=0)return "rune";
 return "etc";
}
function nameOf(x){return x.name||x.raw||x.kind||x.quality||"읽지 못한 아이템"}
function hourKey(t){var d=new Date(t*1000);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()+"-"+d.getHours()}
function hourTitle(t){var d=new Date(t*1000),n=new Date(),y=new Date(n.getTime()-864e5);
 var day=d.toDateString()===n.toDateString()?"오늘":d.toDateString()===y.toDateString()?"어제":(d.getMonth()+1)+"월 "+d.getDate()+"일";
 return day+" "+d.getHours()+"시"}
function hhmm(t){var d=new Date(t*1000);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function sub(x){
 if(x.action==="보관")return "보관함 "+(x.tab||"")+" 탭"+(x.kind&&x.kind!==nameOf(x)?" · "+x.kind:"");
 return x.action+(x.score!=null?" · "+x.score+"점":"");
}
var starOf={},starTried=false;
function loadStars(cb){
 if(keep){mkStars();cb&&cb();return}
 fetch("/api/keeplist").then(function(r){return r.json()}).then(function(d){keep=d;mkStars();cb&&cb()}).catch(function(){cb&&cb()});
}
function mkStars(){starOf={};Object.keys(keep.classes||{}).forEach(function(c){keep.classes[c].forEach(function(x){starOf[x.n]=Math.max(starOf[x.n]||0,x.star||0)})})}
function starsOf(x){return starOf[x.name]||starOf[x.kind]||starOf[x.raw]||0}
function starHtml(st){return '<span class="stars" role="img" aria-label="중요도 '+st+'/5"><i>'+"★".repeat(st)+"</i>"+"★".repeat(5-st)+"</span>"}
function loadEssStat(){
 fetch("/api/essences").then(function(r){return r.json()}).then(drawEssStat).catch(function(){});
}
function fmtN(v,d){return v==null?"–":(Math.round(v*Math.pow(10,d||0))/Math.pow(10,d||0)).toString()}
function drawEssStat(d){
 var el=$("essStat");
 if(!d||!d.runs){el.innerHTML='<div class="etop"><div><b>불타는 정수 통계</b><small>판마다 대장장이에서 불타는 공포의 정수 수량을 읽어 늘어난 만큼 셉니다.</small></div></div><div class="none">아직 기록이 없습니다. 두 판 이상 돌면 판당·시간당 정수가 여기에 나옵니다.</div>';el.hidden=false;return}
 var t=d.today||{},rec=(d.recent||[]).slice().reverse(),mx=Math.max.apply(null,rec.map(function(x){return x.gained}).concat([1]));
 var stg=(d.stages||[]),best=stg.length&&stg[0].per_hour?stg[0].stage:null,smx=Math.max.apply(null,stg.map(function(x){return x.per_hour||0}).concat([1]));
 el.innerHTML='<div class="etop"><div><b>불타는 정수 통계</b><small>최근 3일 · '+d.runs+'판</small></div><div class="big">'+fmtN(d.per_hour,1)+'<small>시간당 개수</small></div></div>'+
  '<div class="kv"><div><span>오늘 얻음</span><b>'+(t.gained||0)+'개</b></div><div><span>판당</span><b>'+fmtN(d.per_run,2)+'개</b></div><div><span>판당 시간</span><b>'+(d.min_per_run!=null?fmtN(d.min_per_run,1)+"분":"–")+'</b></div></div>'+
  (rec.length?'<div class="spark" aria-label="최근 판별 얻은 정수">'+rec.map(function(x){return '<i class="'+(x.gained?"":"z")+'" style="height:'+(x.gained?Math.max(8,100*x.gained/mx):6)+'%" title="'+x.gained+'개"></i>'}).join("")+'</div><div class="cap"><span>'+rec.length+'판 전</span><span>최근 판</span></div>':"")+
  (stg.length?'<h4>단계별 (시간당 많은 순)</h4><div class="stg">'+stg.map(function(x){
   var nm=x.stage?"공포 "+x.stage+"단계":"단계 미지정";
   return '<span class="'+(x.stage===best?"best":"")+'">'+nm+'</span><span class="ebar"><i style="width:'+(100*(x.per_hour||0)/smx)+'%"></i></span><em>'+fmtN(x.per_hour,1)+'/시간 · '+fmtN(x.per_run,2)+'/판 · '+x.runs+'판</em>'}).join("")+"</div>":"");
 el.hidden=false;
}
function loadItems(){
 if(!keep&&!starTried){starTried=true;loadStars(loadItems);return}
 loadEssStat();
 fetch("/api/items").then(function(r){return r.json()}).then(function(d){items=d.items||[];drawItems()}).catch(function(){});
}
function drawEss(ess){
 // essences: only how many, not a list
 if(!ess.length){$("essSum").hidden=true;return}
 var by={},today=0,td=new Date().toDateString();
 ess.forEach(function(x){var k=nameOf(x);by[k]=(by[k]||0)+1;if(new Date(x.t*1000).toDateString()===td)today++});
 var names=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
 $("essSum").innerHTML='<div class="hd"><b>모은 정수</b><span class="n">'+ess.length+'<small>개</small></span></div>'+
  '<div class="sub">오늘 '+today+'개 · 보관함에 넣은 횟수 기준</div><ul>'+
  names.map(function(k){return "<li><span>"+esc(k)+"</span><span>"+by[k]+"개</span></li>"}).join("")+"</ul>";
 $("essSum").hidden=false;
}
function drawItems(){
 $("clearItems").hidden=!items.length;
 var all=items;
 drawEss(all.filter(function(x){return catOf(x)==="ess"}));
 var items_=all.filter(function(x){return catOf(x)!=="ess"});
 var cnt={};CATS.forEach(function(c){cnt[c[0]]=0});
 items_.forEach(function(x){cnt.all++;cnt[catOf(x)]++;if(starsOf(x))cnt.star++});
 $("chips").innerHTML=CATS.map(function(c){return '<button type="button" data-c="'+c[0]+'" aria-pressed="'+(cat===c[0])+'">'+c[1]+"<b>"+cnt[c[0]]+"</b></button>"}).join("");
 Array.prototype.forEach.call($("chips").children,function(b){b.onclick=function(){cat=b.dataset.c;shown=200;drawItems()}});
 var list=items_.filter(function(x){return cat==="all"||(cat==="star"?starsOf(x)>0:catOf(x)===cat)});
 if(!list.length){$("list").innerHTML='<div class="empty">'+(items_.length?"이 종류로 모은 아이템이 없습니다.":"아직 모은 아이템이 없습니다. 대장장이에서 보관하거나 등록한 아이템이 여기에 시간순으로 쌓입니다.")+"</div>";return}
 var html="",key="",grp=[];
 function flush(){if(!grp.length)return;html+='<div class="hour"><b>'+hourTitle(grp[0].t)+"</b><span>"+grp.length+"개</span></div>"+grp.map(row).join("");grp=[]}
 list.slice(0,shown).forEach(function(x){var k=hourKey(x.t);if(k!==key){flush();key=k}grp.push(x)});flush();
 if(list.length>shown)html+='<button class="more" type="button" id="more">더 보기 ('+(list.length-shown)+"개 남음)</button>";
 $("list").innerHTML=html;
 if($("more"))$("more").onclick=function(){shown+=200;drawItems()};
 Array.prototype.forEach.call(document.querySelectorAll(".it"),function(b){b.onclick=function(){zoom(b.dataset.img,b.dataset.cap)}});
}
function row(x){
 var th=x.img?' style="background-image:url(/items/'+x.img+')"':"",st=starsOf(x);
 return '<button class="it'+(st?" starred":"")+'" type="button" data-img="'+(x.img||"")+'" data-cap="'+esc(nameOf(x)+" · "+sub(x)+" · "+hhmm(x.t))+'"><span class="th"'+th+'></span><span><span class="nm q-'+(x.color||"")+'">'+esc(nameOf(x))+'</span>'+(st?starHtml(st):"")+'<span class="sb">'+esc(sub(x))+"</span></span><time>"+hhmm(x.t)+"</time></button>";
}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function zoom(img,cap){if(!img)return;var z=document.createElement("div");z.className="zoom";
 z.innerHTML='<div><img src="/items/'+img+'" alt=""><p>'+cap+"</p></div>";z.onclick=function(){z.remove()};document.body.appendChild(z)}

/* ---- keep list: per class, every item here goes to the stash (never sold, never registered) ---- */
var keep=null,kcls="";
var TYPE_CLS={"유니크":"t-u","세트":"t-s","룬워드":"t-r"};
function loadKeep(){
 fetch("/api/keeplist").then(function(r){return r.json()}).then(function(d){keep=d;if(!kcls)kcls=(d.order||[])[0]||"";drawKeep()}).catch(function(){});
}
function drawKeep(){
 if(!keep)return;
 var pics={};(keep.pics||[]).forEach(function(n){pics[n]=1});
 var all={};Object.keys(keep.classes).forEach(function(c){keep.classes[c].forEach(function(x){all[x.n]=1})});
 var npic=Object.keys(all).filter(function(n){return pics[n]}).length,ntot=Object.keys(all).length;
 $("kpNote").innerHTML="<b>주우면 보관함으로 가는 아이템</b>여기 있는 아이템은 팔지도, 수집품에 등록하지도 않고 대장장이에서 보관함에 넣습니다. 모든 직업의 목록이 함께 적용됩니다. 별은 중요도(★5가 최상)입니다."+
  '<div class="ocr'+(keep.ocr?"":" off")+'"><i></i><span>'+(keep.ocr?"글자 인식이 켜져 있어 목록의 "+ntot+"개를 모두 이름으로 알아봅니다.":
  "글자 인식(Tesseract)이 꺼져 있어 <b style=\"display:inline;color:var(--gold2)\">금색 점</b>이 있는 "+npic+"개만 그림으로 알아봅니다. 나머지 "+(ntot-npic)+"개는 Tesseract를 설치하면 알아봅니다.")+"</span></div>";
 var mn=keep.min_star||1,keepN=0;
 var bestStar={};Object.keys(keep.classes).forEach(function(c){keep.classes[c].forEach(function(x){bestStar[x.n]=Math.max(bestStar[x.n]||0,x.star||0)})});
 Object.keys(bestStar).forEach(function(n){if(bestStar[n]>=mn)keepN++});
 $("kminN").textContent="별 "+mn+"개 이상만 보관 · "+ntot+"개 중 "+keepN+"개";
 $("kSeg").innerHTML=[1,2,3,4,5].map(function(i){return '<button type="button" role="radio" aria-checked="'+(i===mn)+'" data-s="'+i+'">★'+i+"<small>"+(i===1?"전부":"이상")+"</small></button>"}).join("");
 Array.prototype.forEach.call($("kSeg").children,function(b){b.onclick=function(){
  var n=+b.dataset.s;if(n===mn)return;keep.min_star=n;drawKeep();
  post("/api/keepstar",{star:n}).catch(function(){})}});
 $("kChips").innerHTML=(keep.order||[]).map(function(c){return '<button type="button" data-c="'+esc(c)+'" aria-pressed="'+(c===kcls)+'">'+esc(c)+"<b>"+(keep.classes[c]||[]).length+"</b></button>"}).join("");
 Array.prototype.forEach.call($("kChips").children,function(b){b.onclick=function(){kcls=b.dataset.c;drawKeep()}});
 var list=keep.classes[kcls]||[],html="";
 ["룬워드","유니크","세트"].forEach(function(t){
  var g=list.filter(function(x){return x.t===t}).sort(function(a,b){return (b.star||0)-(a.star||0)});if(!g.length)return;
  html+='<div class="kg"><b>'+t+"</b><span>"+g.length+"개</span></div>"+g.map(function(x){
   var st=x.star||0;
   var off=(bestStar[x.n]||0)<mn;
   return '<div class="ki'+(off?" off":"")+'"><span class="nm '+(TYPE_CLS[x.t]||"")+'">'+esc(x.n)+'<span class="stars" role="img" aria-label="중요도 '+st+'/5">'+
    '<i>'+"★".repeat(st)+"</i>"+"★".repeat(5-st)+"</span></span>"+'<span class="sb">'+esc(x.b+" · "+x.why)+
    '</span><span class="how'+(!off&&pics[x.n]?" pic":"")+'">'+(off?"보관 안 함":pics[x.n]?"그림":"글자")+"</span></div>"}).join("");
 });
 $("kList").innerHTML=html;
}
/* ---- run table ---- */
var runs=[],openRun=null,runsT=null;
function two(n){return (n<10?"0":"")+n}
function hms(t){if(!t)return "";var d=new Date(t*1000);return two(d.getHours())+":"+two(d.getMinutes())+":"+two(d.getSeconds())}
function hm(t){if(!t)return "";var d=new Date(t*1000);return two(d.getHours())+":"+two(d.getMinutes())}
function mss(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+two(s%60)}
function loadRuns(){
 fetch("/api/runs").then(function(r){return r.json()}).then(function(d){runs=d.runs||[];var skew=Date.now()/1000-(d.now||Date.now()/1000);
  runs.forEach(function(r){r._skew=skew});drawRuns()}).catch(function(){});
}
function drawRuns(){
 var now=Date.now()/1000,cur=runs.length&&runs[0].live?runs[0]:null;
 var t0=new Date();t0.setHours(0,0,0,0);t0=t0.getTime()/1000;
 var td=runs.filter(function(r){return r.start>=t0}),done=td.filter(function(r){return !r.live});
 var ess=td.filter(function(r){return r.ess!=null}),essN=ess.reduce(function(a,r){return a+r.ess},0);
 var timed=done.filter(function(r){return r.ess!=null}),secs=timed.reduce(function(a,r){return a+r.secs},0);
 var itemsN=td.reduce(function(a,r){return a+r.items.length},0);
 if(cur){var el=now-(cur._skew||0)-cur.start;$("rNow").innerHTML='<i class="dotl"></i><div><b>'+cur.n+'판 진행 중</b><span>공포 '+(cur.stage||"-")+'단계 · '+hm(cur.start)+' 시작</span></div><span class="clk">'+mss(el)+"</span>";$("rNow").hidden=false}
 else $("rNow").hidden=true;
 $("rSum").innerHTML='<div><span>오늘 판</span><b>'+td.length+'</b></div><div><span>판당 평균</span><b>'+(done.length?mss(done.reduce(function(a,r){return a+r.secs},0)/done.length):"–")+
  '</b></div><div><span>보관·등록</span><b>'+itemsN+'개</b></div><div><span>오늘 불타는 정수</span><b class="g">'+(ess.length?essN+"개":"–")+
  '</b></div><div><span>정수 / 시간</span><b class="g">'+(secs>60?(Math.round(timed.reduce(function(a,r){return a+r.ess},0)*36000/secs)/10):"–")+
  '</b></div><div><span>정수 / 판</span><b class="g">'+(ess.length?Math.round(essN*100/ess.length)/100:"–")+"</b></div>";
 if(!runs.length){$("rRows").innerHTML='<div class="rempty">아직 기록된 판이 없습니다. 사냥터에 들어가면 판마다 한 줄씩 생기고, 진행 중인 판은 시간이 흘러갑니다.</div>';return}
 $("rRows").innerHTML=runs.map(function(r){
  var dur=r.live?now-(r._skew||0)-r.start:r.secs,names=r.items.map(function(x){return x.name});
  var row='<button type="button" class="rr'+(r.live?" live":"")+'" data-n="'+r.n+'" aria-expanded="'+(openRun===r.n)+'"><span class="c1">'+r.n+
   '</span><span class="c2">'+hm(r.start)+" → "+(r.live?"진행 중":hm(r.end))+'<small>공포 '+(r.stage||"-")+'단계</small></span><span class="c3">'+mss(dur)+
   '</span><span class="c4'+(r.ess?"":" z")+'">'+(r.ess==null?"–":r.ess)+'</span><span class="c5">'+(names.length?"<b>"+names.length+"</b>"+esc(names.join(", ")):"")+"</span></button>";
  if(openRun===r.n){
   row+='<div class="rdet">'+(r.items.length?r.items.map(function(x){return "<p><time>"+hms(x.t)+"</time><span>"+esc(x.name)+"</span><em>"+esc(x.action+(x.tab?" · "+x.tab+" 탭":""))+"</em></p>"}).join(""):
    '<p><span style="color:var(--ash)">보관·등록한 아이템 없음 (판매한 아이템은 기록하지 않음)</span></p>')+
    '<div class="why">'+hms(r.start)+" ~ "+(r.live?"진행 중":hms(r.end))+(r.why?" · "+esc(r.why):"")+"</div></div>";
  }
  return row}).join("");
 Array.prototype.forEach.call(document.querySelectorAll(".rr"),function(b){b.onclick=function(){var n=+b.dataset.n;openRun=openRun===n?null:n;drawRuns()}});
}
function show(v){
 var it=v==="items",kp=v==="keep",rn=v==="runs",ctl=!it&&!kp&&!rn;
 $("itemsView").hidden=!it;$("keepView").hidden=!kp;$("runsView").hidden=!rn;$("ctlView").hidden=!ctl;
 $("v-items").setAttribute("aria-selected",String(it));$("v-keep").setAttribute("aria-selected",String(kp));
 $("v-runs").setAttribute("aria-selected",String(rn));$("v-ctl").setAttribute("aria-selected",String(ctl));
 clearInterval(runsT);runsT=null;
 if(!ctl){stopStream();if(it)loadItems();else if(kp)loadKeep();else{loadRuns();
  runsT=setInterval(function(){if(document.hidden)return;var k=(runsT.k=(runsT.k||0)+1);if(k%3===0)loadRuns();else drawRuns()},1000)}}
 else if(!stillT){startStream()}
 history.replaceState(null,"",it?"#items":kp?"#keep":rn?"#runs":"#");
}
$("clearItems").onclick=function(){
 if(!items.length)return;
 if(!confirm("모은 아이템 목록 "+items.length+"개를 비울까요?\n(기록은 PC의 collected 폴더 안 old_ 폴더로 옮겨 둡니다)"))return;
 fetch("/api/items/clear",{method:"POST"}).then(function(r){return r.json()}).then(function(){items=[];cat="all";drawItems()}).catch(function(){});
};
$("v-ctl").onclick=function(){show("ctl")};$("v-items").onclick=function(){show("items")};$("v-keep").onclick=function(){show("keep")};$("v-runs").onclick=function(){show("runs")};
setInterval(function(){if(!$("itemsView").hidden&&!document.hidden)loadItems()},15000);
if(location.hash==="#items")show("items");else if(location.hash==="#keep")show("keep");else if(location.hash==="#runs")show("runs");

document.addEventListener("visibilitychange",function(){if(document.hidden){stopStream()}else{status();if(!stillT&&!$("ctlView").hidden)startStream()}});
</script></body></html>
